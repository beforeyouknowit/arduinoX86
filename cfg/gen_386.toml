[test_gen]
set_version_major = 1
set_version_minor = 0
cpu_type = "Intel80386Ex"
# Execution mode - Real, Unreal, Protected
cpu_mode = "Real"
base_seed = 0xDEADBEEF
stop_on_error = true
# Termination method - Queue, Halt
termination_condition = "Halt"
test_output_dir = "e:/test_output_386"
trace_output_dir = "trace"
validate_output_dir = "validate"
skip_validated = true
trace_file_suffix = "_trace.log"
error_file_suffix = "_error.log"
moo_version_major = 1
moo_version_minor = 1
moo_arch = "386E"
gen_widths = ["Sixteen"] # 386 has 16-bit and 32-bit modes
skip_io = false
address_mask = 0xFFFFFF # 24-bit address mask for 386EX
ip_mask = 0xFFF8 # 16-bit mask for instruction pointer.
instruction_address_range = [0x1024, 0xFFFFFF] # Allowed instruction address range
max_normal_cycles = 300 # Maximum normal instruction cycles (non-string op)
max_normal_bus_ops = 16 # Maximum normal bus operations (non-string op)

opcode_range = [0xE0, 0xE2]

#opcode_override = 0x5c
group_extension_range = [0, 7] # Range for group extensions

isa_db = "80386.csv" # Instruction set database file

# Overrides for specific group opcodes. These groups may not be valid for the full 0-7 range.
group_extension_overrides = [
    { opcode = 0xFE, group_extension_range = [0, 1] },
    { opcode = 0xFF, group_extension_range = [0, 6] },
    { opcode = 0x0F00, group_extension_range = [0, 5] },
    { opcode = 0x0F01, group_extension_range = [0, 6] }, # 5 isn't valid but we can't skip it
    { opcode = 0x0FBA, group_extension_range = [4, 7] },
]

valid_opcodes = [
