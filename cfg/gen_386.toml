excluded_opcodes = [
    0xF1, # LOCK prefix
    0x63, # ARPL, not valid in real mode
    0x0F20, 0x0F22, # MOV to/from control registers
    0x0F21, 0x0F23, # MOV to/from debug registers
]

io_opcodes = [
    0xE4, 0xE5, 0xE6, 0xE7,
    0xEC,
    0xED,
    0xEE,
    0xEF,
    0x6C, 0x6D, 0x6E, 0x6F,
]

exclude_esc_opcodes = true

test_count = 2500
append_file = true

# shift/rotate mask
writeless_null_shifts = true # CPU will skip writing operand if shift is 0
shift_mask = 0x001F # Mask for shift/rotate counts (5 bits)

# Probabilities for random number generation
register_beta = [0.65, 0.65] # Beta distribution for register value selection.
max_prefixes = 6 # Maximum number of prefixes per instruction
prefix_beta = [0.1, 1.5] # Beta distribution for prefix count
lock_prefix_chance = 0.025 # Chance of LOCK prefix
lock_prefix_opcode = 0xF0
rep_prefix_chance = 0.25 # Chance of REP prefix

sib_chance = 0.20 # Chance of SIB byte reference in generated 32-bit mod/rm bytes

reg_zero_chance = 0.025 # Chance of zeroed register
reg_ones_chance = 0.025 # Chance of an all-bit-set register
reg_inject_chance = 0.10 # Chance of injecting a special value into a register

imm_zero_chance = 0.025 # Chance of zeroed immediate value
imm_ones_chance = 0.025 # Chance of an all-bit-set immediate value
imm_inject_chance = 0.10 # Chance of injecting a special value into an immediate value

imm8s_zero_chance = 0.025 # Chance of zeroed 8-bit immediate value
imm8s_min_chance = 0.025 # Chance of minimum 8-bit signed immediate value
imm8s_max_chance = 0.025 # Chance of maximum 8-bit signed immediate value
imm8s_inject_chance = 0.10 # Chance of injecting a special value into an 8-bit signed immediate value

sp_odd_chance = 0.1 # Chance of SP being odd
sp_min_value = 0x0008 # Minimum value for SP
sp_max_value = 0xFFFFFFFF # Maximum value for SP
sp_min_address = 0x420 # Minimum SS:SP address

instruction_pad = 9 # Number of padding bytes to add after each instruction. This should be able to account for SIB + 32bit displacement + 32bit immediate.

near_branch_ban = [
    0, # Infinite loop.
    -3, -2, -1, 1, 2, 3, 4, 5, 6, 7, # Overlaps jump instruction
    8, 9, 10, 11, 12, 13 # Aligns with prefetch
]

